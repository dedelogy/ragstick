const POISE = 1;                 // Poise: jumlah hit yang ditahan sebelum terlempar (1 = hit ke-2 melempar). Sebelumnya 3.

const HIT_ACTIVE_EXT = 0.45;     // pukulan mulai bisa mengenai saat ayunan >= 45% (sebelumnya 60%)

const OBSTACLE_ROUND = 4;        // ronde 4+ : platform rapuh (platform poise)

const PLATFORM_POISE = 1;        // injakan yang ditahan platform rapuh; injakan berikutnya membuatnya jatuh
const PLATFORM_SHAKE = 14;       // frame bergetar sebelum jatuh
const PLATFORM_RESPAWN = 180;    // frame sampai platform kembali (poise penuh)
const ZOMBIE_SPEED = 0.5;        // pengali kecepatan jalan zombie
const ZOMBIE_POISE = 1;          // poise zombie
const ZOMBIE_MOTION = 0.6;       // kekuatan pukulan zombie
const ZOMBIE_STOP = 24;          // jarak berhenti zombie dari target
const REACH_UP = 120;            // tinggi lompat aman untuk generator (hasil ukur kaki naik +-173px)
const MAX_TIERS = 7;             // batas tingkat vertikal agar satu ronde tidak terlalu panjang di layar tinggi
const INTRO_FRAMES = 90, ROUND_END_FRAMES = 210, MATCH_END_FRAMES = 420;

// ---- Stable 4: level PICO PARK (11-20), hazard, senjata ----

const VOID_DEPTH = 900;          // kedalaman jurang di bawah layar
const CRATE_PUSH = 1.6;          // kecepatan peti didorong (px/frame)
const BOMB_R = 84, BOMB_TICK = 170, BOMB_BOOM = 16, BOMB_WAIT = 110;   // bom waktu: radius ledakan, frame hitung mundur, tampil ledakan, jeda
const RESPAWN_INV = 90;          // kebal setelah respawn di checkpoint (frame)
const AXE_SPEED = 11, AXE_R = 9; // kapak lempar
const LEVEL_INFO = {
    11: ['PIT & SPIKE RUN', '#22d3ee'], 12: ['BOMBS & WALL SPIKES', '#f97316'], 13: ['PUSH THE CRATE', '#a3e635'],
    14: ['ZOMBIES x3', '#84cc16'], 15: ['ZOMBIES x5', '#84cc16'],
    16: ['VERTICAL CLIMB', '#38bdf8'], 17: ['VERTICAL CLIMB', '#38bdf8'], 18: ['VERTICAL CLIMB', '#38bdf8'],
    19: ['VERTICAL CLIMB', '#38bdf8'], 20: ['FINAL CLIMB', '#f87171']
};
const LEVEL_WEAPON = { 16: 'longsword', 17: 'spear', 18: 'axe', 19: 'throwaxe', 20: 'longsword' };
// Setiap senjata: pasti menghancurkan poise & langsung melempar korban (knock = pengali kekuatan lempar)
const WEAPONS = {
    longsword: { name: 'LONGSWORD',    frames: 16, len: 50, r: 9,  active: [0.30, 0.80], arc: [-115, 40], knock: 1.2, cd: 8,  color: '#e2e8f0' },
    spear:     { name: 'SPEAR',        frames: 20, len: 74, r: 7,  active: [0.30, 0.75], thrust: true,    knock: 1.3, cd: 10, color: '#cbd5e1' },
    axe:       { name: 'AXE',          frames: 24, len: 40, r: 12, active: [0.40, 0.80], arc: [-125, 55], knock: 1.6, cd: 14, color: '#fca5a5' },
    throwaxe:  { name: 'THROWING AXE', frames: 18, projectile: true, throwAt: 0.35, knock: 1.2, cd: 18, color: '#fcd34d' }
};

const FLOOR_HEIGHT = 60;
const AIR_DRAG = 0.995;

const HEAD_R = 12, FOOT_R = 4, JOINT_R = 4;
const HEAD_DIST = 22, TORSO = 42;
const UPPER_LEG = 28, LOWER_LEG = 28, LEG_LEN = UPPER_LEG + LOWER_LEG;
const UPPER_ARM = 20, LOWER_ARM = 20;
const STANCE = 9;
const STRIDE = 16, STEP_HEIGHT = 9;

// ==========================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height, groundY;
let platforms = [];
let effects = [];
let floorOn = true, levelT = 0;                 // floorOn=false di level Pico (lantai berlubang)
let hazards = [], bombs = [], decor = [], projectiles = [], blasts = [], groundSpans = [], spawns = [];
let crown = { x: 0, y: 0, active: false };
let gameOver = false;            // true saat splash akhir ronde/match (fisika dibekukan)
let winnerName = "";
let winnerColor = "";
let zombies = [];
let hitStop = 0, shakeT = 0, shakeAmp = 0;
let round = 1, scoreP1 = 0, scoreP2 = 0;
let phase = 'intro', phaseT = 0, fightBanner = 0, matchWinner = null;
const NO_INPUT = Object.freeze({ left: false, right: false, jump: false, punch: false });
function inputsEnabled() { return phase === 'fight'; }
function allChars() { return chars.concat(zombies); }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

class Point {
    constructor(x, y, r) {
        this.x = this.oldX = x; this.y = this.oldY = y; this.prevY = y;
        this.r = r; this.pinX = false; this.pinY = false; this.isFoot = false;
    }
    update(g) {
        this.prevY = this.y;
        const vx = clamp((this.x - this.oldX) * AIR_DRAG, -MAX_SPEED, MAX_SPEED);
        const vy = clamp((this.y - this.oldY) * AIR_DRAG, -MAX_SPEED, MAX_SPEED);
        this.oldX = this.x; this.oldY = this.y;
        this.x += vx;
        this.y += vy + g;
    }
    land(surfaceY) {
        this.y = surfaceY - this.r;
        const vx = (this.x - this.oldX) * 0.6;
        this.oldY = this.y + (this.y - this.oldY) * 0.05;
        this.oldX = this.x - vx;
    }
    bounds() {
        if (floorOn && this.y > groundY - this.r) this.land(groundY);
        if (this.y < this.r)          { this.y = this.r;          this.oldY = this.y; } // Memastikan tidak nembus atap layar
        if (this.x > width - this.r)  { this.x = width - this.r;  this.oldX = this.x; }
        if (this.x < this.r)          { this.x = this.r;          this.oldX = this.x; }
    }
}

class Bone {
    constructor(a, b, len) { this.a = a; this.b = b; this.len = len; }
    resolve() {
        const a = this.a, b = this.b;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const f = (this.len - d) / d;
        const ax = a.pinX ? 0 : 1, bx = b.pinX ? 0 : 1, sx = ax + bx;
        const ay = a.pinY ? 0 : 1, by = b.pinY ? 0 : 1, sy = ay + by;
        if (sx > 0) { a.x -= dx * f * ax / sx; b.x += dx * f * bx / sx; }
        if (sy > 0) { a.y -= dy * f * ay / sy; b.y += dy * f * by / sy; }
    }
}

class Platform {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h; this.isGold = false;
        this.oy = y; this.fragile = false; this.poise = PLATFORM_POISE;
        this.full = false; this.isBlock = false;   // full: semua titik tubuh bertabrakan (lantai/blok), bukan hanya kaki
        this.state = 'solid'; this.t = 0; this.vy = 0; this.flash = 0;   // solid | shaking | falling
    }
    get solid() { return this.state === 'solid' || this.state === 'shaking'; }
    stomp() {   // dipijak karakter: poise berkurang 1; bila sudah 0 => bergetar lalu jatuh
        if (!this.fragile || this.state !== 'solid') return;
        if (this.poise > 0) this.poise--;
        else { this.state = 'shaking'; this.t = PLATFORM_SHAKE; }
    }
    update() {
        if (this.flash > 0) this.flash--;
        if (this.state === 'shaking') {
            if (--this.t <= 0) { this.state = 'falling'; this.t = PLATFORM_RESPAWN; this.vy = 0; }
        } else if (this.state === 'falling') {
            this.vy += 0.8; this.y += this.vy;
            if (--this.t <= 0) { this.state = 'solid'; this.y = this.oy; this.poise = PLATFORM_POISE; this.flash = 20; }
        }
    }
    collide(p) {
        if (!this.solid) return;
        if (p.x < this.x || p.x > this.x + this.w) return;
        const prevBottom = p.prevY + p.r, bottom = p.y + p.r;
        if (prevBottom <= this.y + 2 && bottom > this.y) p.land(this.y);
    }
}

// ---------- Stable 4: blok (dinding, rintangan, peti), jebakan duri, bom waktu, kapak lempar ----------
class Block extends Platform {
    constructor(x, y, w, h, kind) {
        super(x, y, w, h);
        this.kind = kind; this.isBlock = true; this.full = true;
        this.movable = kind === 'crate'; this.vx = 0; this.vy = 0; this.ox = x; this.oy0 = y;
    }
    collide(p) {
        if (p.x > this.x && p.x < this.x + this.w) {                       // mendarat di atas blok
            if (p.prevY + p.r <= this.y + 2 && p.y + p.r > this.y) { p.land(this.y); return; }
        }
        const l = this.x - p.r, r = this.x + this.w + p.r;                 // tabrakan samping (blok = dinding)
        if (p.x > l && p.x < r && p.y + p.r > this.y + 3 && p.y - p.r < this.y + this.h) {
            const fromLeft = p.x < this.x + this.w / 2, v = p.x - p.oldX;
            p.x = fromLeft ? l : r;
            if (this.movable && ((fromLeft && v > 0.3) || (!fromLeft && v < -0.3))) this.vx = fromLeft ? CRATE_PUSH : -CRATE_PUSH;   // peti terdorong
            p.oldX = p.x;
        }
    }
    blockedAt(nx) {
        for (const o of platforms) {
            if (o === this || !o.isBlock) continue;
            if (nx < o.x + o.w && nx + this.w > o.x && this.y < o.y + o.h - 2 && this.y + this.h > o.y + 2) return true;
        }
        return nx < 0 || nx + this.w > width;
    }
    update() {
        if (!this.movable) return;
        if (Math.abs(this.vx) > 0.05) { const nx = this.x + this.vx; if (this.blockedAt(nx)) this.vx = 0; else this.x = nx; }
        this.vx *= 0.7;
        let top = floorOn ? groundY : groundY + VOID_DEPTH;                // peti jatuh bila tak ada tumpuan
        for (const o of platforms) {
            if (o === this || !o.solid) continue;
            if (o.x < this.x + this.w - 2 && o.x + o.w > this.x + 2 && o.y >= this.y + this.h - 4 && o.y < top) top = o.y;
        }
        if (this.y + this.h < top - 0.5) { this.vy = Math.min(this.vy + 0.6, 14); this.y = Math.min(this.y + this.vy, top - this.h); }
        else { this.y = top - this.h; this.vy = 0; }
        if (this.y > height + 100) { this.x = this.ox; this.y = this.oy0; this.vx = 0; this.vy = 0; }   // jatuh ke jurang => kembali ke posisi awal
    }
}

// kind: 'floor' (muncul dari lantai), 'left' (keluar dari dinding ke kiri), 'pillar' (dari pilar ke kedua sisi)
class SpikeTrap {
    constructor(o) { Object.assign(this, { w: 0, h: 0, len: 28, period: 120, on: 45, warn: 24, offset: 0 }, o); }
    state() {                                       // siklus: sembunyi -> peringatan (mengintip & bergetar) -> keluar -> sembunyi
        const t = (levelT + this.offset) % this.period, start = this.period - this.on - this.warn;
        if (t < start) return { a: 0, danger: false };
        if (t < start + this.warn) return { a: 0.18 + 0.1 * Math.sin(t * 1.4), danger: false };
        const k = t - start - this.warn;
        const a = k < 4 ? k / 4 : (k > this.on - 4 ? Math.max(0, (this.on - k) / 4) : 1);
        return { a, danger: a >= 0.7 };
    }
    rects(a) {
        const L = this.len * a;
        if (L < 1) return [];
        if (this.kind === 'floor') return [{ x: this.x, y: this.y - L, w: this.w, h: L, dir: 'up' }];
        if (this.kind === 'left') return [{ x: this.x - L, y: this.y, w: L, h: this.h, dir: 'left' }];
        return [{ x: this.x - L, y: this.y, w: L, h: this.h, dir: 'left' }, { x: this.x + this.w, y: this.y, w: L, h: this.h, dir: 'right' }];
    }
    hits(c) {
        const st = this.state();
        if (!st.danger) return false;
        for (const r of this.rects(st.a)) for (const p of c.points)
            if (p.x > r.x - 2 && p.x < r.x + r.w + 2 && p.y > r.y - 2 && p.y < r.y + r.h + 2) return true;
        return false;
    }
}

class TimeBomb {
    constructor(x, y, tick, offset) { this.x = x; this.y = y; this.tick = tick; this.state = 'tick'; this.t = tick + offset; }
    update() {
        if (this.state === 'tick') { if (--this.t <= 0) this.explode(); }
        else if (this.state === 'boom') { if (--this.t <= 0) { this.state = 'wait'; this.t = BOMB_WAIT; } }
        else if (--this.t <= 0) { this.state = 'tick'; this.t = this.tick; }
    }
    explode() {
        this.state = 'boom'; this.t = BOMB_BOOM;
        const cy = this.y - 10;
        blasts.push({ x: this.x, y: cy, t: 0 });
        hitStop = Math.max(hitStop, 6); shakeT = Math.max(shakeT, 14); shakeAmp = Math.max(shakeAmp, SHAKE_THROW);
        for (const c of allChars()) {
            if (c.respawnInv > 0 || c.state === 'thrown') continue;
            const px = c.j.pelvis.x, py = c.j.pelvis.y;
            if (Math.hypot(px - this.x, py - cy) < BOMB_R) {          // ledakan melempar siapa pun di radiusnya
                c.launch((px >= this.x ? 1 : -1) * 0.9 * LAUNCH_X, 1.2 * LAUNCH_Y);
                c.hitFlash = 8;
            }
        }
    }
}

class Axe {   // kapak lempar (proyektil)
    constructor(x, y, dir, owner) { this.x = x; this.y = y; this.dir = dir; this.owner = owner; this.vx = dir * AXE_SPEED; this.vy = -2.5; this.rot = 0; this.life = 110; this.dead = false; }
    update() {
        this.vy += 0.22; this.x += this.vx; this.y += this.vy; this.rot += 0.45 * this.dir;
        if (--this.life <= 0 || this.x < -40 || this.x > width + 40 || this.y > height + 80) { this.dead = true; return; }
        if (floorOn && this.y > groundY) { this.dead = true; return; }
        for (const pl of platforms)
            if (pl.full && pl.solid && this.x > pl.x && this.x < pl.x + pl.w && this.y > pl.y && this.y < pl.y + pl.h) {
                this.dead = true; effects.push({ x: this.x, y: this.y, t: 0 }); return;
            }
        for (const c of allChars()) {
            if (c === this.owner || c.state !== 'normal' || c.invuln > 0) continue;
            if (this.owner.isZombie && c.isZombie) continue;
            if (c.hitBy([{ x: this.x, y: this.y }], AXE_R)) {
                c.receiveHit(this.owner, this.x, this.y, { breakPoise: true, knock: WEAPONS.throwaxe.knock, dir: this.dir });
                this.dead = true; return;
            }
        }
    }
}

function platformUnder(x, bottom) {
    let best = null, by = floorOn ? groundY : groundY + VOID_DEPTH;
    for (const pl of platforms)
        if (pl.solid && x >= pl.x && x <= pl.x + pl.w && pl.y >= bottom - 6 && pl.y < by) { by = pl.y; best = pl; }
    return best;
}
function surfaceFor(x, bottom) {
    const pl = platformUnder(x, bottom);
    return pl ? pl.y : (floorOn ? groundY : groundY + VOID_DEPTH);
}

function distToSeg(px, py, a, b) {   // jarak titik ke ruas garis a-b
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
    const t = l2 ? clamp(((px - a.x) * dx + (py - a.y) * dy) / l2, 0, 1) : 0;
    return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

function pull(p, tx, ty, k, damp) {
    const dx = (tx - p.x) * k, dy = (ty - p.y) * k;
    p.x += dx; p.y += dy;
    p.oldX += dx * damp; p.oldY += dy * damp;
}

// ==========================================================
//  RAGDOLL SYSTEM
// ==========================================================
class Ragdoll {
    constructor(name, color, jointColor, binds) {
        this.name = name; this.color = color; this.jointColor = jointColor;
        this.binds = binds;
        this.input = { left: false, right: false, jump: false, punch: false };
        this.isZombie = false; this.speedMul = 1; this.ai = null;
        this.lastPlat = null; this.airT = 0;
        this.weapon = null; this.cp = { x: 0, y: 0 }; this.cpT = 0; this.respawnInv = 0; this.projFired = false;
    }

    get motionValue()   { return this.isZombie ? ZOMBIE_MOTION : motionValue; }
    get motionDefense() { return this.isZombie ? ZOMBIE_POISE : motionDefense; }
    maxDefense() { return Math.max(0, Math.round(this.motionDefense)); }

    build(cx, fy = groundY) {     // fy = permukaan tempat karakter berdiri (default lantai dasar)
        this.points = []; this.bones = [];
        const P = (x, y, r) => { const p = new Point(x, y, r); this.points.push(p); return p; };
        const B = (a, b, l) => this.bones.push(new Bone(a, b, l));
        const py = fy - FOOT_R - LEG_LEN * 0.95;
        const j = this.j = {};
        j.pelvis = P(cx, py, JOINT_R);
        j.neck   = P(cx, py - TORSO, JOINT_R);
        j.head   = P(cx, py - TORSO - HEAD_DIST, HEAD_R);
        j.elbowL = P(cx - 7, j.neck.y + UPPER_ARM, JOINT_R);
        j.handL  = P(cx - 9, j.neck.y + UPPER_ARM + LOWER_ARM, JOINT_R);
        j.elbowR = P(cx + 7, j.neck.y + UPPER_ARM, JOINT_R);
        j.handR  = P(cx + 9, j.neck.y + UPPER_ARM + LOWER_ARM, JOINT_R);
        j.kneeL  = P(cx - 5, py + UPPER_LEG, JOINT_R);
        j.footL  = P(cx - STANCE, fy - FOOT_R, FOOT_R);
        j.kneeR  = P(cx + 5, py + UPPER_LEG, JOINT_R);
        j.footR  = P(cx + STANCE, fy - FOOT_R, FOOT_R);
        B(j.neck, j.head, HEAD_DIST);
        B(j.pelvis, j.neck, TORSO);
        B(j.neck, j.elbowL, UPPER_ARM);   B(j.elbowL, j.handL, LOWER_ARM);
        B(j.neck, j.elbowR, UPPER_ARM);   B(j.elbowR, j.handR, LOWER_ARM);
        B(j.pelvis, j.kneeL, UPPER_LEG);  B(j.kneeL, j.footL, LOWER_LEG);
        B(j.pelvis, j.kneeR, UPPER_LEG);  B(j.kneeR, j.footR, LOWER_LEG);
        j.footL.isFoot = true; j.footR.isFoot = true;
        this.setRootPinned(true);
        this.state = 'normal'; this.thrownT = 0; this.invuln = 0; this.hitFlash = 0;
        this.punchT = 0; this.punchCd = 0; this.prevPunch = false; this.punchHit = false;
        this.defenseCurrent = this.lastMaxDef = this.maxDefense();
        this.facing = 1; this.stepPhase = 0; this.jumpCooldown = 0;
        this.jumpBuf = 0; this.prevJump = false; this.supported = false;
        this.lastPlat = null; this.airT = 0;
        this.respawnInv = 0; this.projFired = false; this.cpT = 0;
    }

    // Lempar seluruh tubuh: vx bertanda (+ ke kanan), vy positif = ke atas. Pinggul dilepas => ragdoll penuh.
    launch(vx, vy) {
        this.state = 'thrown'; this.thrownT = 0; this.punchT = 0; this.punchCd = 0;
        this.setRootPinned(false);
        this.defenseCurrent = this.maxDefense();
        for (const p of this.points) { p.oldX = p.x - vx; p.oldY = p.y + vy; }
    }

    setRootPinned(v) { this.j.pelvis.pinX = v; this.j.pelvis.pinY = v; }

    controller() {
        const { pelvis, neck, head, elbowL, handL, elbowR, handR, kneeL, footL, kneeR, footR } = this.j;
        const s = MIN_STAND_STRENGTH + (1 - MIN_STAND_STRENGTH) * RAGDOLL_STRENGTH;

        const kTorso = 0.05 + 0.30 * s, kHead = 0.04 + 0.25 * s, kArm = 0.02 + 0.18 * s;
        const kKnee = 0.20 + 0.20 * s, kFoot = 0.35 + 0.15 * s, supportK = 0.25 + 0.25 * s;
        const heightRatio = 0.80 + 0.17 * s;
        const slouch = (1 - s) * 8;
        const spd = walkingSpeed * this.speedMul;
        const stride = clamp(STRIDE * spd / 2.6, 10, 34);

        const inp = inputsEnabled() ? this.input : NO_INPUT;
        if (this.jumpCooldown > 0) this.jumpCooldown--;
        if (this.invuln > 0) this.invuln--;
        if (this.respawnInv > 0) this.respawnInv--;
        if (this.hitFlash > 0) this.hitFlash--;

        const md = this.maxDefense();
        this.defenseCurrent = clamp(this.defenseCurrent + (md - this.lastMaxDef), 0, md);
        this.lastMaxDef = md;

        const feet = [footL, footR], knees = [kneeL, kneeR];
        const surf = feet.map(f => surfaceFor(f.x, f.y + FOOT_R));
        const grd  = feet.map((f, i) => f.y >= surf[i] - FOOT_R - 4);

        if (this.state === 'thrown') {
            this.thrownT++;
            this.supported = false;
            this.prevJump = inp.jump; this.prevPunch = inp.punch; this.lastPlat = null;
            let pelvisGround = floorOn && pelvis.y >= groundY - pelvis.r - 3;
            if (!floorOn) for (const pl of platforms)       // lantai/blok penuh: pinggul bisa berbaring di atasnya
                if (pl.full && pl.solid && pelvis.x > pl.x && pelvis.x < pl.x + pl.w && Math.abs(pelvis.y + pelvis.r - pl.y) < 4) pelvisGround = true;
            const onGround = grd[0] || grd[1] || pelvisGround;
            const slow = Math.abs(pelvis.y - pelvis.oldY) < 2 && Math.abs(pelvis.x - pelvis.oldX) < 2;
            if ((this.thrownT >= THROWN_MIN && onGround && slow) || this.thrownT >= THROWN_MAX) {
                this.state = 'normal';
                this.setRootPinned(true);
                pelvis.oldX = pelvis.x; pelvis.oldY = pelvis.y;
                this.invuln = INVULN_AFTER;
            } else return;
        }

        const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
        if (dir && this.punchT === 0) this.facing = dir;
        const facing = this.facing;

        const punchEdge = inp.punch && !this.prevPunch;
        this.prevPunch = inp.punch;
        const WP = this.weapon ? WEAPONS[this.weapon] : null;
        const dur = WP ? WP.frames : PUNCH_FRAMES;
        if (this.punchCd > 0) this.punchCd--;
        if (punchEdge && this.punchT === 0 && this.punchCd === 0) { this.punchT = 1; this.punchHit = false; this.projFired = false; }
        else if (this.punchT > 0) {
            this.punchT++;
            if (this.punchT > dur) { this.punchT = 0; this.punchCd = WP ? WP.cd : 6; }
        }
        const ext = this.punchT > 0 ? Math.sin(Math.PI * (this.punchT - 1) / (dur - 1)) : 0;
        if (WP && WP.projectile && this.punchT > 0 && !this.projFired && (this.punchT - 1) / (dur - 1) >= WP.throwAt) {
            this.projFired = true;                                   // kapak lempar: tangan player tetap "infinite"
            const hnd = facing > 0 ? handR : handL;
            projectiles.push(new Axe(hnd.x + facing * 10, hnd.y - 6, facing, this));
        }
        const rising = (pelvis.y - pelvis.oldY) < -1.5;
        let supported = (grd[0] || grd[1]) && this.jumpCooldown <= 0 && !rising;

        const edge = inp.jump && !this.prevJump;
        this.prevJump = inp.jump;
        if (edge) this.jumpBuf = 6;
        const wantJump = ALLOW_HOLD_JUMP ? inp.jump : this.jumpBuf > 0;
        if (wantJump && supported) {
            for (const p of this.points) p.oldY = p.y + jumpPower;
            this.jumpCooldown = 6; this.jumpBuf = 0;
            supported = false;
        } else if (this.jumpBuf > 0) this.jumpBuf--;
        this.supported = supported;

        // Platform poise: hitung "injakan" baru (pendaratan / pindah platform). Zombie tidak ikut menginjak.
        if (supported) {
            let top = Infinity, standing = null;
            for (let i = 0; i < 2; i++) if (grd[i] && surf[i] < top) { top = surf[i]; standing = platformUnder(feet[i].x, feet[i].y + FOOT_R); }
            if (standing && standing !== this.lastPlat && !this.isZombie) standing.stomp();
            this.lastPlat = standing;
            this.airT = 0;
            // Checkpoint (level Pico): pijakan aman terakhir, jauh dari jebakan & bukan di tepi jurang
            if (!floorOn && standing && !this.isZombie && this.state === 'normal' && !standing.movable && standing.state === 'solid' && --this.cpT <= 0) {
                this.cpT = 10;
                const cx = pelvis.x, cy = standing.y;
                if (surfaceFor(cx - 24, cy - 2) <= cy + 1 && surfaceFor(cx + 24, cy - 2) <= cy + 1 && !hazardNear(cx, cy)) this.cp = { x: cx, y: cy };
            }
        } else if (++this.airT >= 4) this.lastPlat = null;

        if (supported) {
            let top = Infinity;
            for (let i = 0; i < 2; i++) if (grd[i]) top = Math.min(top, surf[i]);
            const ty = top - FOOT_R - LEG_LEN * heightRatio;
            const dy = Math.max((ty - pelvis.y) * supportK, -GETUP_MAX);
            pelvis.y += dy; pelvis.oldY += dy;
            pelvis.oldY = pelvis.y - (pelvis.y - pelvis.oldY) * 0.5;
        }

        const accel = supported ? 0.08 + 0.17 * s : 0.04;
        if (supported || dir) {
            let vx = pelvis.x - pelvis.oldX;
            vx += (dir * spd - vx) * accel;
            pelvis.oldX = pelvis.x - vx;
        }

        const lean = dir * (5 + (1 - s) * 4);
        pull(neck, pelvis.x + facing * slouch + lean + facing * 4 * ext, pelvis.y - TORSO, kTorso, 0.5);
        pull(head, neck.x + facing * slouch * 0.5 + lean * 0.5, neck.y - HEAD_DIST, kHead, 0.5);

        if (dir && supported) this.stepPhase += Math.PI * spd / (2 * stride);
        for (let i = 0; i < 2; i++) {
            const foot = feet[i], knee = knees[i], side = i === 0 ? -1 : 1;
            let tx, ty;
            if (supported) {
                let lift = 0;
                if (dir) {
                    const ph = this.stepPhase + i * Math.PI;
                    tx = pelvis.x + dir * stride * Math.cos(ph);
                    lift = Math.max(0, -Math.sin(ph)) * STEP_HEIGHT;
                } else tx = pelvis.x + side * STANCE;
                ty = surfaceFor(tx, foot.y + FOOT_R) - FOOT_R - lift;
            } else {
                tx = pelvis.x + side * 6;
                ty = pelvis.y + LEG_LEN * 0.8;
            }
            pull(foot, tx, ty, kFoot, 0.3);
            pull(knee, (pelvis.x + foot.x) / 2 + facing * 6, (pelvis.y + foot.y) / 2, kKnee, 0.5);
        }

        const arms = [[elbowL, handL], [elbowR, handR]];
        for (let i = 0; i < 2; i++) {
            const side = i === 0 ? -1 : 1, [elbow, hand] = arms[i];
            if (ext > 0 && i === (facing > 0 ? 1 : 0)) {
                pull(elbow, neck.x + facing * (6 + 16 * ext), neck.y + 10, 0.5, 0.2);
                pull(hand,  neck.x + facing * (8 + 32 * ext), neck.y + 12, 0.6, 0.15);
                continue;
            }
            if (supported) {
                const swing = dir ? Math.sin(this.stepPhase + (i === 0 ? Math.PI : 0)) * 10 : 0;
                pull(elbow, neck.x + side * 7 + swing * 0.5, neck.y + 18, kArm, 0.4);
                pull(hand,  neck.x + side * 9 + swing,       neck.y + 36, kArm, 0.35);
            } else {
                pull(elbow, neck.x + side * 14, neck.y + 12, kArm, 0.4);
                pull(hand,  neck.x + side * 22, neck.y + 22, kArm, 0.35);
            }
        }
    }

    // Posisi gagang (a) dan ujung senjata (b) saat siaga / menyerang
    weaponSeg() {
        const WP = WEAPONS[this.weapon], f = this.facing;
        const hand = f > 0 ? this.j.handR : this.j.handL;
        const t = this.punchT > 0 ? (this.punchT - 1) / (WP.frames - 1) : -1;
        let ang, len = WP.len;
        if (WP.projectile) {
            len = 20; ang = t < 0 ? -75 : (t < WP.throwAt ? -75 - 70 * (t / WP.throwAt) : -20);
            if (t >= WP.throwAt && t < 0.65) len = 0;                  // kapak sedang terlempar, tangan kosong sesaat
        } else if (t < 0) { ang = WP.thrust ? -62 : -78; len = WP.thrust ? WP.len * 0.9 : WP.len; }
        else if (WP.thrust) { const e = Math.sin(Math.PI * clamp(t, 0, 1)); ang = -62 + 58 * e; len = WP.len * (0.55 + 0.45 * e); }
        else { const e = clamp(t / 0.8, 0, 1); ang = WP.arc[0] + (WP.arc[1] - WP.arc[0]) * (1 - (1 - e) * (1 - e)); }
        const rad = ang * Math.PI / 180;
        return { a: { x: hand.x, y: hand.y }, b: { x: hand.x + f * Math.cos(rad) * len, y: hand.y + Math.sin(rad) * len } };
    }

    // Hitbox: kepalan / bilah senjata vs tulang lawan (kapsul) dan kepala (lingkaran)
    checkHit() {
        if (this.state !== 'normal' || this.punchT === 0 || this.punchHit || phase !== 'fight') return;
        const WP = this.weapon ? WEAPONS[this.weapon] : null;
        let samples, rad = FIST_R, opts = {}, ox, oy;
        if (WP) {
            if (WP.projectile) return;                                   // kapak lempar dihitung oleh proyektilnya
            const t = (this.punchT - 1) / (WP.frames - 1);
            if (t < WP.active[0] || t > WP.active[1]) return;
            const sg = this.weaponSeg();
            samples = [0.3, 0.55, 0.8, 1].map(f => ({ x: sg.a.x + (sg.b.x - sg.a.x) * f, y: sg.a.y + (sg.b.y - sg.a.y) * f }));
            rad = WP.r; opts = { breakPoise: true, knock: WP.knock }; ox = sg.b.x; oy = sg.b.y;
        } else {
            const ext = Math.sin(Math.PI * (this.punchT - 1) / (PUNCH_FRAMES - 1));
            if (ext < HIT_ACTIVE_EXT) return;
            const hand = this.facing > 0 ? this.j.handR : this.j.handL;
            const elbow = this.facing > 0 ? this.j.elbowR : this.j.elbowL;
            samples = [hand, { x: (hand.x + elbow.x) / 2, y: (hand.y + elbow.y) / 2 }];
            ox = hand.x; oy = hand.y;
        }
        for (const o of allChars()) {
            if (o === this || o.state !== 'normal' || o.invuln > 0) continue;
            if (this.isZombie && o.isZombie) continue;           // zombie hanya memusuhi pemain
            if (o.hitBy(samples, rad)) {
                this.punchHit = true;
                o.receiveHit(this, ox, oy, opts);
                return;
            }
        }
    }

    hitBy(fists, r = FIST_R) {
        const head = this.j.head;
        for (const f of fists) {
            if (Math.hypot(f.x - head.x, f.y - head.y) < r + HEAD_R) return true;
            for (const b of this.bones) if (distToSeg(f.x, f.y, b.a, b.b) < r + BODY_R) return true;
        }
        return false;
    }

    // opts: { breakPoise (senjata: selalu melempar), knock (pengali kekuatan lempar), dir (arah, untuk proyektil) }
    receiveHit(attacker, hx, hy, opts = {}) {
        const mv = attacker.motionValue, dir = opts.dir || attacker.facing, knock = opts.knock || 1;
        this.hitFlash = 8;
        effects.push({ x: hx, y: hy, t: 0 });
        if (this.defenseCurrent > 0 && !opts.breakPoise) {
            this.defenseCurrent--;
            for (const p of this.points) p.oldX -= dir * mv * HIT_PUSH;
            hitStop = Math.max(hitStop, HITSTOP_HIT);
            shakeT = Math.max(shakeT, HITSTOP_HIT + 4); shakeAmp = Math.max(shakeAmp, SHAKE_HIT);
        } else {
            this.launch(dir * mv * knock * LAUNCH_X, mv * knock * LAUNCH_Y);
            hitStop = HITSTOP_THROW;
            shakeT = HITSTOP_THROW + 6; shakeAmp = SHAKE_THROW;
        }
    }

    step() {
        if (gameOver) return; // Freeze Physics if game is over
        for (const p of this.points) p.update(GRAVITY);
        if (this.ai) this.ai(this);
        this.controller();
        for (let i = 0; i < 12; i++) {
            for (const b of this.bones) b.resolve();
            for (const p of this.points) {
                p.bounds();
                for (const pl of platforms) if (p.isFoot || pl.full) pl.collide(p);   // kaki: semua platform; lantai/blok: semua titik
            }
        }
        this.checkHit();
    }

    draw() {
        const { head } = this.j;
        if (this.respawnInv > 0 && Math.floor(this.respawnInv / 4) % 2) ctx.globalAlpha = 0.35;   // berkedip setelah respawn
        const col = this.hitFlash > 0 ? '#ffffff' : this.color;
        ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
        for (const b of this.bones) {
            ctx.beginPath(); ctx.moveTo(b.a.x, b.a.y); ctx.lineTo(b.b.x, b.b.y); ctx.stroke();
        }
        ctx.fillStyle = this.jointColor;
        for (const p of this.points) {
            if (p === head) continue;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r - 1, 0, Math.PI * 2); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(head.x, head.y, HEAD_R, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a'; ctx.fill();
        ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.stroke();
        ctx.fillStyle = this.jointColor;
        ctx.beginPath(); ctx.arc(head.x + this.facing * 5, head.y - 2, 2, 0, Math.PI * 2); ctx.fill();
        
        const md = Math.min(this.maxDefense(), 10), w = 8;
        for (let i = 0; i < md; i++) {
            ctx.beginPath(); ctx.arc(head.x + (i - (md - 1) / 2) * w, head.y - HEAD_R - 12, 2.5, 0, Math.PI * 2);
            if (i < this.defenseCurrent) { ctx.fillStyle = this.color; ctx.fill(); }
            else { ctx.strokeStyle = this.color; ctx.lineWidth = 1; ctx.stroke(); }
        }
        if (this.weapon && this.state === 'normal') this.drawWeapon();
        ctx.globalAlpha = 1;
    }

    drawWeapon() {
        const WP = WEAPONS[this.weapon], sg = this.weaponSeg(), f = this.facing;
        const dx = sg.b.x - sg.a.x, dy = sg.b.y - sg.a.y, L = Math.hypot(dx, dy);
        if (L < 1) return;
        const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
        ctx.lineCap = 'round';
        if (this.weapon === 'throwaxe') {                                   // kapak di tangan
            ctx.strokeStyle = '#92400e'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(sg.a.x, sg.a.y); ctx.lineTo(sg.b.x, sg.b.y); ctx.stroke();
            ctx.fillStyle = WP.color; ctx.beginPath();
            ctx.moveTo(sg.b.x - ux * 4, sg.b.y - uy * 4); ctx.lineTo(sg.b.x + nx * 9 * f + ux * 2, sg.b.y + ny * 9 * f + uy * 2); ctx.lineTo(sg.b.x + ux * 5, sg.b.y + uy * 5); ctx.closePath(); ctx.fill();
            return;
        }
        if (this.weapon === 'spear') {
            ctx.strokeStyle = '#92400e'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(sg.a.x - ux * 14, sg.a.y - uy * 14); ctx.lineTo(sg.b.x, sg.b.y); ctx.stroke();
            ctx.fillStyle = WP.color; ctx.beginPath();
            ctx.moveTo(sg.b.x + ux * 12, sg.b.y + uy * 12); ctx.lineTo(sg.b.x + nx * 4, sg.b.y + ny * 4); ctx.lineTo(sg.b.x - nx * 4, sg.b.y - ny * 4); ctx.closePath(); ctx.fill();
            return;
        }
        if (this.weapon === 'axe') {
            ctx.strokeStyle = '#92400e'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(sg.a.x, sg.a.y); ctx.lineTo(sg.b.x, sg.b.y); ctx.stroke();
            ctx.fillStyle = WP.color; ctx.beginPath();
            ctx.moveTo(sg.b.x - ux * 12, sg.b.y - uy * 12);
            ctx.lineTo(sg.b.x + nx * 13 * f + ux * 2, sg.b.y + ny * 13 * f + uy * 2);
            ctx.lineTo(sg.b.x + ux * 6, sg.b.y + uy * 6); ctx.closePath(); ctx.fill();
            return;
        }
        ctx.strokeStyle = WP.color; ctx.lineWidth = 4;                      // longsword
        ctx.beginPath(); ctx.moveTo(sg.a.x + ux * 8, sg.a.y + uy * 8); ctx.lineTo(sg.b.x, sg.b.y); ctx.stroke();
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;                     // gagang pelindung
        ctx.beginPath(); ctx.moveTo(sg.a.x + ux * 8 + nx * 6, sg.a.y + uy * 8 + ny * 6); ctx.lineTo(sg.a.x + ux * 8 - nx * 6, sg.a.y + uy * 8 - ny * 6); ctx.stroke();
    }
}

const p1 = new Ragdoll('P1', '#38bdf8', '#e0f2fe', { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', punch: 'ArrowDown' });
const p2 = new Ragdoll('P2', '#fb923c', '#ffedd5', { left: 'KeyA', right: 'KeyD', jump: 'KeyW', punch: 'KeyS' });
const chars = [p1, p2];

function randomizeColors() {
    const colors = ['#ef4444', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#eab308'];   // hijau dikosongkan: warna zombie
    let c1 = colors[Math.floor(Math.random() * colors.length)];
    let c2;
    do { c2 = colors[Math.floor(Math.random() * colors.length)]; } while (c1 === c2);
    
    p1.color = c1;
    p2.color = c2;
    p1.jointColor = '#ffffff';
    p2.jointColor = '#ffffff';

}

function resetChars() {
    if (floorOn) { p1.build(width * 0.35); p2.build(width * 0.65); p1.cp = { x: width * 0.35, y: groundY }; p2.cp = { x: width * 0.65, y: groundY }; }
    else { p1.build(spawns[0].x, spawns[0].y); p2.build(spawns[1].x, spawns[1].y); p1.cp = { ...spawns[0] }; p2.cp = { ...spawns[1] }; }
}

// Mati (jatuh ke jurang / terkena duri): kembali ke checkpoint terakhir dengan kebal sesaat
function killChar(c) {
    effects.push({ x: c.j.pelvis.x, y: Math.min(c.j.pelvis.y, height - 20), t: 0 });
    c.build(c.cp.x, c.cp.y);
    c.respawnInv = RESPAWN_INV; c.invuln = RESPAWN_INV;
}

function hazardNear(x, y) {
    for (const h of hazards) {
        const hx = h.kind === 'floor' ? h.x + h.w / 2 : h.x, half = h.kind === 'floor' ? h.w / 2 + 70 : 90;
        if (Math.abs(x - hx) < half && Math.abs(y - h.y) < 200) return true;
    }
    for (const b of bombs) if (Math.abs(x - b.x) < 110 && Math.abs(y - b.y) < 120) return true;
    return false;
}

function courseChecks() {
    if (floorOn || gameOver || phase !== 'fight') return;
    for (const c of allChars()) {
        if (c.respawnInv > 0) continue;
        if (c.j.pelvis.y > height + 40) { killChar(c); continue; }       // jatuh ke lubang
        for (const hz of hazards) if (hz.hits(c)) { killChar(c); break; }
    }
}

// ==========================================================
//  PLATFORM GENERATION (Random & Golden Crown)
// ==========================================================
// ----- Stable 3: generator acak yang dijamin bisa dicapai (cabang, zig-zag, lebar bervariasi) -----
function hGap(a, b) { return Math.max(0, Math.max(a.x - (b.x + b.w), b.x - (a.x + a.w))); }
function gapAllowed(dy) { return dy >= 0 ? 80 - 25 * Math.min(1, dy / REACH_UP) : 85; }   // batas aman (hasil ukur lompatan sempurna: 140px di datar, 80px di ketinggian 150px)
function canReach(a, b) { const dy = a.y - b.y; return dy <= REACH_UP && hGap(a, b) <= gapAllowed(dy); }

function tryGeneratePlatforms() {
    const margin = 40, list = [], floorP = { x: 0, y: groundY, w: width, h: 0 };
    const place = (y, w) => {
        for (let k = 0; k < 30; k++) {
            const cand = new Platform(margin + Math.random() * Math.max(0, width - w - margin * 2), y, w, 12);
            if (!(canReach(floorP, cand) || list.some(p => canReach(p, cand)))) continue;
            if (list.some(p => Math.abs(p.y - y) < 55 && hGap(p, cand) < 40)) continue;
            return cand;
        }
        return null;
    };
    let y = groundY - (70 + Math.random() * 40), tiers = 0;
    while (y >= 210 && tiers < MAX_TIERS) {
        const n = tiers > 0 && Math.random() < 0.5 ? 2 : 1;     // kadang 2 platform di satu tingkat = rute alternatif
        for (let c = 0; c < n; c++) {
            const pl = place(y + (Math.random() - 0.5) * 24, platformWidth * (0.75 + Math.random() * 0.5));
            if (pl) list.push(pl); else if (c === 0) return null;
        }
        tiers++;
        y -= 60 + Math.random() * 60;
    }
    if (!list.length) return null;
    const gy = Math.max(130, Math.min(...list.map(p => p.y)) - (60 + Math.random() * 50));
    for (let k = 0; k < 40; k++) {
        const gold = new Platform(margin + Math.random() * Math.max(0, width - platformWidth - margin * 2), gy, platformWidth, 12);
        if (list.some(p => canReach(p, gold)) && !list.some(p => Math.abs(p.y - gy) < 55 && hGap(p, gold) < 40)) {
            gold.isGold = true; list.push(gold); return list;
        }
    }
    return null;
}

function verifyPlatforms(list) {   // semua platform (termasuk emas) harus terjangkau dari lantai
    const floorP = { x: 0, y: groundY, w: width, h: 0 }, seen = new Set(), stack = [];
    for (const p of list) if (canReach(floorP, p)) { seen.add(p); stack.push(p); }
    while (stack.length) {
        const a = stack.pop();
        for (const b of list) if (!seen.has(b) && canReach(a, b)) { seen.add(b); stack.push(b); }
    }
    return list.every(p => seen.has(p));
}

function generateRandomPlatforms() {
    for (let attempt = 0; attempt < 60; attempt++) {
        const list = tryGeneratePlatforms();
        if (list && verifyPlatforms(list)) {
            platforms = list;
            const gold = list[list.length - 1];
            crown.x = gold.x + gold.w / 2;
            crown.y = gold.y - 35;
            crown.active = true;
            return;
        }
    }
    generateStairPlatforms();    // cadangan: generator tangga lama
}

// ==========================================================
//  STABLE 4: LEVEL PICO PARK (11-20) - lintasan rintangan satu layar, kiri -> kanan
// ==========================================================
function addGround(x0, x1, y) {          // lantai tebal (menopang semua titik) bila setinggi dasar; selain itu ledge tipis
    if (x1 - x0 < 1) return null;
    let pl;
    if (Math.abs(y - groundY) < 1) { pl = new Platform(x0, y, x1 - x0, height - y + VOID_DEPTH); pl.full = true; }
    else pl = new Platform(x0, y, x1 - x0, 14);
    platforms.push(pl);
    groundSpans.push({ x0, x1, y });
    return pl;
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function generateCourse(L) {
    floorOn = false;
    platforms = []; hazards = []; bombs = []; decor = []; groundSpans = []; blasts = [];
    const d = L - 10, G = groundY, rnd = (a, b) => a + Math.random() * (b - a);
    const goalX = width - 210, xEnd = goalX - 20, minTop = 215;
    let x = 190, y = G;
    addGround(0, 190, G);                                    // zona start
    spawns = [{ x: 60, y: G }, { x: 125, y: G }];

    // tingkat kesulitan bertahap (d = 1..10)
    const P = { gap: [58 + 3 * d, 66 + 3 * d], hurdle: [36 + 3 * d, Math.min(90, 52 + 4 * d)],
                period: Math.max(90, 140 - 5 * d), on: 42 + d, warn: Math.max(16, 30 - d),
                tick: Math.max(100, BOMB_TICK - 8 * d), step: Math.min(92, 66 + 3 * d), spikeW: Math.min(150, 60 + 8 * d) };
    const T = () => Math.floor(rnd(0, P.period));
    const trap = o => hazards.push(new SpikeTrap({ period: P.period, on: P.on, warn: P.warn, offset: T(), ...o }));
    const wantClimb = [0, 0, 0, 0, 0, 0, 2, 4, 4, 6, 6][d];  // langkah vertikal per climb (level 16-20)

    const EST = { run: 150, pit: 70 + P.gap[1] + 90, hurdle: 194, floorSpike: 120 + P.spikeW, wallSpike: 190, bomb: 230, crateWall: 340, climb: 262 };
    const build = {
        run() { const len = rnd(90, 150); addGround(x, x + len, y); x += len; },
        pit() { const g = rnd(P.gap[0], P.gap[1]); addGround(x, x + 70, y); addGround(x + 70 + g, x + 70 + g + 90, y); x += 160 + g; },
        hurdle() {                                            // rintangan yang harus dilompati
            const h = rnd(P.hurdle[0], P.hurdle[1]);
            addGround(x, x + 194, y); platforms.push(new Block(x + 80, y - h, 34, h, 'hurdle')); x += 194;
        },
        floorSpike() {                                        // duri muncul dari lantai
            const w = rnd(60, P.spikeW);
            addGround(x, x + 120 + w, y); trap({ kind: 'floor', x: x + 60, y, w, len: 26 }); x += 120 + w;
        },
        wallSpike() {                                         // dinding yang mengeluarkan duri ke sisi yang didekati
            const h = rnd(P.hurdle[0] + 10, 92), bx = x + 80;
            addGround(x, x + 190, y); platforms.push(new Block(bx, y - h, 30, h, 'wall'));
            trap({ kind: 'left', x: bx, y: y - h + 10, h: h - 14, len: 36 }); x += 190;
        },
        bomb() {                                              // bom waktu: hitung mundur lalu meledak & melempar
            addGround(x, x + 230, y);
            bombs.push(new TimeBomb(x + 80, y, P.tick, Math.floor(rnd(0, 60))));
            if (L >= 13) bombs.push(new TimeBomb(x + 160, y, P.tick, Math.floor(rnd(60, 120))));
            x += 230;
        },
        crateWall() {                                         // tembok terlalu tinggi: dorong peti lalu panjat
            addGround(x, x + 340, y);
            platforms.push(new Block(x + 60, y - 78, 70, 78, 'crate'));
            platforms.push(new Block(x + 210, y - 190, 34, 190, 'wall'));
            x += 340;
        },
        climb() {                                             // tebing zig-zag + pilar berduri (vertikal)
            const maxN = Math.floor((y - minTop) / P.step), n = Math.min(wantClimb || 2, maxN - (maxN % 2));
            if (n < 2) return build.run();
            const SW = 260, LW = 110;
            addGround(x, x + SW, y);                          // lantai di bawah tebing (jaring pengaman bila jatuh)
            for (let k = 1; k <= n; k++) platforms.push(new Platform(k % 2 === 1 ? x + 10 : x + SW - LW, y - k * P.step, LW, 14));
            const px = x + 127;
            decor.push({ x: px, w: 16, y0: y - n * P.step - 70, y1: y });
            if (d >= 2) for (let k = 1; k <= n; k++)
                trap({ kind: 'pillar', x: px, w: 16, y: y - k * P.step - 95, h: 65, len: 28, offset: Math.floor(k * P.period / (n + 1)) });
            x += SW; y -= n * P.step;
        }
    };

    const pool = [['run', 1], ['pit', 3], ['hurdle', 2], ['floorSpike', 2]], forced = [];
    if (L >= 12) pool.push(['wallSpike', 2], ['bomb', 2]);
    if (L === 12) forced.push('bomb', 'wallSpike');
    if (L >= 13) pool.push(['crateWall', 2]);
    if (L === 13) forced.push('crateWall');
    if (L >= 16) {
        pool.length = 0;
        pool.push(['climb', 5], ['pit', 2], ['floorSpike', 2], ['wallSpike', 1], ['bomb', 1], ['hurdle', 1]);
        forced.push('climb'); if (L >= 18) forced.push('climb');
    }
    const pick = () => { let r = Math.random() * pool.reduce((a, q) => a + q[1], 0); for (const q of pool) { r -= q[1]; if (r <= 0) return q[0]; } return 'run'; };

    const seq = []; let total = 0; const budget = xEnd - x;      // susun urutan yang pasti muat di layar
    for (const k of forced) if (total + EST[k] <= budget) { seq.push(k); total += EST[k]; }
    for (let g = 0; g < 40 && seq.length < 9; g++) {
        const k = pick();
        if (k === 'run' && seq[seq.length - 1] === 'run') continue;
        if (total + EST[k] <= budget) { seq.push(k); total += EST[k]; }
    }
    shuffle(seq);
    for (const k of seq) build[k]();

    if (x < width - 20) addGround(x, width - 20, y);
    const gold = new Platform(goalX, y - 80, 150, 14); gold.isGold = true; platforms.push(gold);   // tujuan: mahkota
    crown.x = gold.x + gold.w / 2; crown.y = gold.y - 35; crown.active = true;
}

function generateStairPlatforms() {
    platforms = [];
    
    // Titik awal X yang lebih acak, tidak selalu di tengah
    let safeMarginX = 60;
    let safeWidth = width - platformWidth - (safeMarginX * 2);
    let currentX = safeMarginX + Math.random() * safeWidth;
    let currentY = groundY - 100;
    
    // Lempar arah ke sisi yang memiliki ruang lebih luas
    let dir = currentX < width / 2 ? 1 : -1;

    let numPlats = 5 + Math.floor(Math.random() * 4); // 5 to 8 levels

    for (let i = 0; i < numPlats; i++) {
        // BATAS ATAS LAYAR: Stop buat platform jika jarak ke langit-langit sisa < 160px
        if (currentY < 160) {
            break;
        }

        platforms.push(new Platform(currentX, currentY, platformWidth, 12));

        // Jarak Vertikal: Dijamin bisa dicapai oleh jumpPower 19.5 (max height ~200px)
        let jumpY = 75 + Math.random() * 45; 
        currentY -= jumpY;

        // Jarak Horizontal: Overlap ringan sampai jarak lompat wajar
        let moveX = (70 + Math.random() * 80) * dir;
        currentX += moveX;

        // Bounce dari dinding: Mencegah platform keluar dari sisi kiri atau kanan layar
        if (currentX < 20) {
            currentX = 20 + Math.random() * 40;
            dir = 1; // Pantulkan balik ke kanan
        } else if (currentX > width - platformWidth - 20) {
            currentX = width - platformWidth - 20 - Math.random() * 40;
            dir = -1; // Pantulkan balik ke kiri
        }
    }

    // Platform Tertinggi (Golden)
    // GARANSI: Koordinat Y mahkota tidak akan pernah tembus keluar browser
    if (currentY < 90) currentY = 90; 
    
    let goldPlat = new Platform(currentX, currentY, platformWidth, 12);
    goldPlat.isGold = true;
    platforms.push(goldPlat);

    crown.x = currentX + platformWidth / 2;
    crown.y = currentY - 35; // Berada sempurna di atas platform
    crown.active = true;
}

// ==========================================================
//  GAME LOGIC
// ==========================================================
function checkWinCondition() {
    if (gameOver || !crown.active || phase !== 'fight') return;
    let best = null, bestD = 35;                       // yang paling dekat ke mahkota menang (bila bersamaan)
    const gold = platforms.find(p => p.isGold);
    for (const c of chars) {
        // Harus berada DI ATAS platform emas: mahkota tidak bisa diambil dari bawah dengan menembus platform
        if (gold && Math.max(c.j.footL.y, c.j.footR.y) + FOOT_R > gold.y + 2) continue;
        const d = Math.min(Math.hypot(c.j.head.x - crown.x, c.j.head.y - crown.y),
                           Math.hypot(c.j.pelvis.x - crown.x, c.j.pelvis.y - crown.y));
        if (d < bestD) { bestD = d; best = c; }
    }
    if (best) endRound(best);
}

// ---------- Ronde & skor ----------
function levelFor(r) { return Math.min(r, MAX_ROUNDS); }          // Sudden Death memakai konfigurasi level terakhir
function roundZombies(r) {
    const L = levelFor(r);
    if (L >= ZOMBIE_ROUND && L <= 10) return 2 + 2 * (L - ZOMBIE_ROUND);   // level 7-10: 2,4,6,8
    return L === 14 ? 3 : L === 15 ? 5 : 0;                                  // level 14: 3, level 15: 5
}

function endRound(winner) {
    crown.active = false; gameOver = true;
    winnerName = winner.name; winnerColor = winner.color;
    if (winner === p1) scoreP1++; else scoreP2++;
    if (round >= MAX_ROUNDS && scoreP1 !== scoreP2) {       // ronde terakhir selesai & ada pemenang (atau Sudden Death selesai)
        matchWinner = scoreP1 > scoreP2 ? p1 : p2;
        phase = 'matchEnd'; phaseT = MATCH_END_FRAMES;
    } else { phase = 'roundEnd'; phaseT = ROUND_END_FRAMES; }
}

function startRound() {
    gameOver = false; hitStop = 0; shakeT = 0; shakeAmp = 0; effects = [];
    levelT = 0; projectiles = []; blasts = []; hazards = []; bombs = []; decor = []; groundSpans = []; floorOn = true;
    const L = levelFor(round);
    if (L >= PICO_ROUND) generateCourse(L);
    else {
        generateRandomPlatforms();
        if (L >= OBSTACLE_ROUND) for (const pl of platforms) if (!pl.isGold && Math.random() < 0.5) pl.fragile = true;
    }
    resetChars();
    for (const c of chars) c.weapon = LEVEL_WEAPON[L] || null;
    spawnZombies(roundZombies(round));
    phase = 'intro'; phaseT = INTRO_FRAMES; fightBanner = 0;
}

function newMatch() {
    round = 1; scoreP1 = 0; scoreP2 = 0; matchWinner = null;
    randomizeColors();          // warna diacak per match (bukan per ronde) supaya skor mudah dibaca
    startRound();
}

// ---------- Zombie ----------
function zombieAI(z) {
    const inp = z.input;
    inp.left = inp.right = inp.jump = inp.punch = false;
    if (phase !== 'fight' || z.state !== 'normal') return;
    let tgt = null, best = Infinity;
    for (const c of chars) {
        const d = Math.abs(c.j.pelvis.x - z.j.pelvis.x) + Math.abs(c.j.pelvis.y - z.j.pelvis.y) + (c.state === 'normal' ? 0 : 400);
        if (d < best) { best = d; tgt = c; }
    }
    if (!tgt) return;
    const dx = tgt.j.pelvis.x - z.j.pelvis.x, dy = tgt.j.pelvis.y - z.j.pelvis.y;
    if (Math.abs(dx) > ZOMBIE_STOP) { inp.right = dx > 0; inp.left = dx < 0; }
    if (z.aiJump > 0) z.aiJump--;
    const sgn = dx > 0 ? 1 : -1, px = z.j.pelvis.x, fy = z.j.footR.y + FOOT_R;
    const pitAhead = !floorOn && surfaceFor(px + sgn * 36, fy) > fy + 40;           // lubang di depan
    let wallAhead = false;                                                          // blok/dinding di depan
    for (const pl of platforms) {
        if (!pl.isBlock || !pl.solid) continue;
        const bx = sgn > 0 ? pl.x : pl.x + pl.w, ahead = (bx - px) * sgn;
        if (ahead > 0 && ahead < 44 && pl.y < fy - 8 && pl.y + pl.h > fy - 30 && fy - pl.y < 110) { wallAhead = true; break; }
    }
    if (z.supported && z.aiJump <= 0 && (pitAhead || wallAhead || (dy < -50 && Math.abs(dx) < 170))) { inp.jump = true; z.aiJump = 40 + Math.random() * 40; }
    if (Math.abs(dx) < 46 && Math.abs(dy) < 45 && Math.random() < 0.06) {
        if (z.punchT === 0) z.facing = dx > 0 ? 1 : -1;
        inp.punch = true;
    }
}

function zombieSpawnX(taken) {          // spawn zombie di lantai dasar, jauh dari jebakan, bom, dan blok
    for (let k = 0; k < 60; k++) {
        const sp = groundSpans[Math.floor(Math.random() * groundSpans.length)];
        if (!sp || Math.abs(sp.y - groundY) > 1 || sp.x1 - sp.x0 < 120) continue;
        const x = sp.x0 + 50 + Math.random() * (sp.x1 - sp.x0 - 100);
        if (x < 300 || hazardNear(x, groundY) || taken.some(v => Math.abs(v - x) < 70)) continue;
        if (platforms.some(q => q.isBlock && x > q.x - 60 && x < q.x + q.w + 60)) continue;
        return x;
    }
    return width * 0.6;
}

function spawnZombies(n) {
    zombies = [];
    const xs = [];
    for (let i = 0; i < n; i++) {
        let x = 0, tries = 0;
        do { x = 50 + Math.random() * Math.max(1, width - 100); tries++; }
        while (tries < 40 && (chars.some(c => Math.abs(c.j.pelvis.x - x) < 220) || xs.some(v => Math.abs(v - x) < 70)));
        if (!floorOn) x = zombieSpawnX(xs);
        xs.push(x);
        const z = new Ragdoll('Z' + (i + 1), '#84cc16', '#ecfccb', {});
        z.isZombie = true; z.speedMul = ZOMBIE_SPEED; z.ai = zombieAI; z.aiJump = 0;
        z.build(x);
        z.cp = { x, y: groundY };
        zombies.push(z);
    }
}

function step() {
    if (shakeT > 0 && --shakeT === 0) shakeAmp = 0;
    if (fightBanner > 0) fightBanner--;
    // timer fase berbasis frame (tidak terpengaruh resize / pindah tab)
    if (phase === 'intro') { if (--phaseT <= 0) { phase = 'fight'; fightBanner = 40; } }
    else if (phase === 'roundEnd') { if (--phaseT <= 0) { round++; startRound(); return; } }
    else if (phase === 'matchEnd') { if (--phaseT <= 0) { newMatch(); return; } }
    for (const f of effects) f.t++;
    effects = effects.filter(f => f.t < 14);
    for (const b of blasts) b.t++;
    blasts = blasts.filter(b => b.t < BOMB_BOOM);
    if (hitStop > 0) { hitStop--; return; }          // HITSTOP: seluruh dunia membeku sesaat
    if (!gameOver) {
        for (const pl of platforms) pl.update();
        if (phase === 'fight') {
            levelT++;                                                   // jam level: menggerakkan siklus duri
            for (const b of bombs) b.update();
            for (const a of projectiles) a.update();
            projectiles = projectiles.filter(a => !a.dead);
        }
    }
    for (const c of allChars()) c.step();
    courseChecks();
    checkWinCondition();
}

// ---------- HUD & splash ala arcade ----------
const ARCADE = '"Press Start 2P", "Courier New", monospace';

function drawPip(x, y, r, color, lit) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (lit) {
        ctx.shadowColor = color; ctx.shadowBlur = 16; ctx.fillStyle = color; ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, Math.PI * 2); ctx.fill();
    } else {
        ctx.strokeStyle = 'rgba(148,163,184,0.45)'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.shadowBlur = 0;
}

function drawHUD() {
    const sc = clamp(width / 1000, 0.55, 1), R = 5, gap = Math.min(22, 290 / MAX_ROUNDS), off = 82, sd = round > MAX_ROUNDS;
    ctx.save();
    ctx.translate(width / 2, 14 * sc); ctx.scale(sc, sc);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(8,10,30,0.85)'; ctx.fillRect(-62, 0, 124, 52);
    ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 3; ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 12;
    ctx.strokeRect(-62, 0, 124, 52); ctx.shadowBlur = 0;
    ctx.font = `10px ${ARCADE}`; ctx.fillStyle = '#fde047'; ctx.fillText(sd ? 'SUDDEN' : 'ROUND', 0, 15);
    ctx.font = `${sd ? 14 : 20}px ${ARCADE}`; ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#f0abfc'; ctx.shadowBlur = 8;
    ctx.fillText(sd ? 'DEATH' : `${round}/${MAX_ROUNDS}`, 0, 37); ctx.shadowBlur = 0;
    for (let i = 0; i < MAX_ROUNDS; i++) {
        drawPip(-(off + i * gap), 20, R, p1.color, i < scoreP1);
        drawPip(off + i * gap, 20, R, p2.color, i < scoreP2);
    }
    ctx.font = `9px ${ARCADE}`;
    ctx.textAlign = 'right'; ctx.fillStyle = p1.color; ctx.fillText(`P1  ${scoreP1}/${MAX_ROUNDS}`, -off + R, 46);
    ctx.textAlign = 'left';  ctx.fillStyle = p2.color; ctx.fillText(`${scoreP2}/${MAX_ROUNDS}  P2`, off - R, 46);
    ctx.restore();
}

function drawSplash() {
    const cx = width / 2, cy = height / 2, sc = clamp(width / 1100, 0.5, 1);
    const glow = (txt, y, size, color) => {
        ctx.font = `${Math.round(size * sc)}px ${ARCADE}`; ctx.fillStyle = color;
        ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.fillText(txt, cx, y); ctx.shadowBlur = 0;
    };
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (phase === 'intro' || fightBanner > 0) {
        if (phase === 'intro') {
            glow(round > MAX_ROUNDS ? 'SUDDEN DEATH' : `ROUND ${round}`, cy - 40 * sc, 56, '#fde047');
            const L = levelFor(round), nz = roundZombies(round), info = LEVEL_INFO[L];
            if (L >= PICO_ROUND) {
                glow(info[0], cy + 20 * sc, 22, info[1]);
                if (LEVEL_WEAPON[L]) glow(`WEAPON: ${WEAPONS[LEVEL_WEAPON[L]].name} - BREAKS POISE`, cy + 62 * sc, 14, '#fcd34d');
            }
            else if (nz) glow(`ZOMBIES x${nz}`, cy + 20 * sc, 22, '#84cc16');
            else if (L >= OBSTACLE_ROUND) glow('CRUMBLING PLATFORMS', cy + 20 * sc, 22, '#f59e0b');
        } else glow('FIGHT!', cy - 40 * sc, 72, '#f87171');
        if (phase === 'intro') {
            ctx.font = `10px ${ARCADE}`; ctx.fillStyle = '#94a3b8';
            ctx.fillText('P1: ARROWS MOVE  UP JUMP  DOWN ATTACK', cx, groundY + 22);
            ctx.fillText('P2: A / D MOVE  W JUMP  S ATTACK', cx, groundY + 42);
        }
        return;
    }
    if (!gameOver) return;
    ctx.fillStyle = 'rgba(8,10,30,0.88)'; ctx.fillRect(0, 0, width, height);
    const isMatch = phase === 'matchEnd';
    const score = (y, size) => {
        ctx.font = `${Math.round(size * sc)}px ${ARCADE}`;
        const t = `${scoreP1}  :  ${scoreP2}`;
        ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 14; ctx.fillText(t, cx, y); ctx.shadowBlur = 0;
        ctx.font = `${Math.round(14 * sc)}px ${ARCADE}`;
        ctx.fillStyle = p1.color; ctx.fillText('P1', cx - 230 * sc, y);
        ctx.fillStyle = p2.color; ctx.fillText('P2', cx + 230 * sc, y);
    };
    if (isMatch) {
        glow(`PLAYER ${matchWinner.name} WINS THE MATCH!`, cy - 90 * sc, 30, matchWinner.color);
        glow('FINAL SCORE', cy - 30 * sc, 16, '#fde047');
        score(cy + 25 * sc, 40);
    } else {
        glow(`PLAYER ${winnerName} WINS!`, cy - 100 * sc, 40, winnerColor);
        glow(`ROUND ${round} / ${MAX_ROUNDS}`, cy - 45 * sc, 18, '#fde047');
        score(cy + 15 * sc, 40);
        if (round >= MAX_ROUNDS) glow('TIED - SUDDEN DEATH NEXT!', cy + 80 * sc, 16, '#f87171');
    }
    ctx.font = `${Math.round(11 * sc)}px ${ARCADE}`; ctx.fillStyle = '#94a3b8';
    ctx.fillText(`1 ROUND WIN = 1 POINT   |   ${MAX_ROUNDS} ROUNDS   |   MAX SCORE ${MAX_ROUNDS}`, cx, cy + 130 * sc);
    if (Math.floor(Date.now() / 450) % 2 === 0) { ctx.fillStyle = '#e2e8f0'; ctx.fillText(isMatch ? 'NEW MATCH SOON... (ENTER)' : 'NEXT ROUND... (ENTER)', cx, cy + 165 * sc); }
}

// ---------- gambar objek level Pico ----------
function drawGround(pl) {
    ctx.fillStyle = '#334155'; ctx.fillRect(pl.x, pl.y, pl.w, height - pl.y + 10);
    ctx.fillStyle = '#475569'; ctx.fillRect(pl.x, pl.y, pl.w, 3);
}

function drawBlock(b) {
    if (b.kind === 'crate') {
        ctx.fillStyle = '#a16207'; ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#713f12'; ctx.lineWidth = 3; ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
        ctx.beginPath(); ctx.moveTo(b.x + 4, b.y + 4); ctx.lineTo(b.x + b.w - 4, b.y + b.h - 4); ctx.moveTo(b.x + b.w - 4, b.y + 4); ctx.lineTo(b.x + 4, b.y + b.h - 4); ctx.stroke();
        return;
    }
    ctx.fillStyle = '#475569'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(b.x, b.y, b.w, 3);
    ctx.strokeStyle = 'rgba(15,23,42,0.45)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let yy = b.y + 18; yy < b.y + b.h; yy += 18) { ctx.moveTo(b.x, yy); ctx.lineTo(b.x + b.w, yy); }
    ctx.stroke();
}

function drawSpikes(r, danger) {
    ctx.fillStyle = danger ? '#fecaca' : '#cbd5e1'; ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 1;
    const span = r.dir === 'up' ? r.w : r.h, n = Math.max(1, Math.round(span / 10)), sz = span / n;
    for (let i = 0; i < n; i++) {
        ctx.beginPath();
        if (r.dir === 'up') { ctx.moveTo(r.x + i * sz, r.y + r.h); ctx.lineTo(r.x + (i + 0.5) * sz, r.y); ctx.lineTo(r.x + (i + 1) * sz, r.y + r.h); }
        else if (r.dir === 'left') { ctx.moveTo(r.x + r.w, r.y + i * sz); ctx.lineTo(r.x, r.y + (i + 0.5) * sz); ctx.lineTo(r.x + r.w, r.y + (i + 1) * sz); }
        else { ctx.moveTo(r.x, r.y + i * sz); ctx.lineTo(r.x + r.w, r.y + (i + 0.5) * sz); ctx.lineTo(r.x, r.y + (i + 1) * sz); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
    }
}

function drawBomb(b) {
    if (b.state === 'boom') return;
    const cx = b.x, cy = b.y - 11;
    if (b.state === 'wait') ctx.globalAlpha = 0.25;
    if (b.state === 'tick' && b.t < 60) { ctx.strokeStyle = 'rgba(248,113,113,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, BOMB_R, 0, Math.PI * 2); ctx.stroke(); }
    const hot = b.state === 'tick' && b.t < 60 && Math.floor(b.t / 5) % 2 === 0;
    ctx.fillStyle = hot ? '#dc2626' : '#111827'; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#fbbf24'; ctx.beginPath(); ctx.moveTo(cx + 5, cy - 9); ctx.lineTo(cx + 9, cy - 16); ctx.stroke();
    if (b.state === 'tick' && b.t <= 180) {
        ctx.fillStyle = '#fde047'; ctx.font = `10px ${ARCADE}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(Math.ceil(b.t / 60)), cx, cy - 26);
    }
    ctx.globalAlpha = 1;
}

function drawAxe(a) {
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.strokeStyle = '#92400e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.fillStyle = WEAPONS.throwaxe.color; ctx.beginPath(); ctx.moveTo(3, -1); ctx.lineTo(9, -10); ctx.lineTo(11, 8); ctx.lineTo(3, 1); ctx.closePath(); ctx.fill();
    ctx.restore();
}

function drawCourseObjects() {
    for (const d of decor) {                                            // pilar dinding tempat duri keluar
        ctx.fillStyle = '#1e293b'; ctx.fillRect(d.x, d.y0, d.w, d.y1 - d.y0);
        ctx.fillStyle = '#334155'; ctx.fillRect(d.x, d.y0, 3, d.y1 - d.y0);
    }
    for (const hz of hazards) {
        const st = phase === 'fight' ? hz.state() : { a: 0, danger: false };
        ctx.fillStyle = '#7f1d1d';                                      // lubang/pelat jebakan (selalu terlihat)
        if (hz.kind === 'floor') ctx.fillRect(hz.x, hz.y, hz.w, 4);
        else if (hz.kind === 'left') ctx.fillRect(hz.x - 3, hz.y, 3, hz.h);
        else { ctx.fillRect(hz.x - 3, hz.y, 3, hz.h); ctx.fillRect(hz.x + hz.w, hz.y, 3, hz.h); }
        for (const r of hz.rects(st.a)) drawSpikes(r, st.danger);
    }
    for (const b of bombs) drawBomb(b);
}

function draw() {
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    if (shakeT > 0) { const a = shakeAmp * Math.min(1, shakeT / 6); ctx.translate((Math.random() - 0.5) * 2 * a, (Math.random() - 0.5) * 2 * a); }
    if (floorOn) {
        ctx.fillStyle = '#334155'; ctx.fillRect(0, groundY, width, height - groundY);
        ctx.fillStyle = '#475569'; ctx.fillRect(0, groundY, width, 3);
    }
    
    // Draw Platforms
    for (const pl of platforms) {
        if (pl.isBlock) { drawBlock(pl); continue; }
        if (pl.full) { drawGround(pl); continue; }
        const dx = pl.state === 'shaking' ? (Math.random() - 0.5) * 4 : 0;
        ctx.globalAlpha = pl.state === 'falling' ? clamp(1 - (pl.y - pl.oy) / 220, 0, 1) : 1;
        if (pl.isGold) {
            ctx.shadowColor = "rgba(251, 191, 36, 0.8)";
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
            ctx.fillStyle = '#fef08a'; ctx.fillRect(pl.x, pl.y, pl.w, 3);
            ctx.shadowBlur = 0;
        } else {
            let c1 = '#4d5f4f', c2 = '#6b8f71';
            if (pl.fragile) { if (pl.poise > 0) { c1 = '#6b5a3f'; c2 = '#d9a441'; } else { c1 = '#5a3b2e'; c2 = '#f97316'; } }
            ctx.fillStyle = c1; ctx.fillRect(pl.x + dx, pl.y, pl.w, pl.h);
            ctx.fillStyle = c2; ctx.fillRect(pl.x + dx, pl.y, pl.w, 3);
            if (pl.fragile && pl.poise === 0) {          // retakan: injakan berikutnya = jatuh
                ctx.strokeStyle = '#1f130d'; ctx.lineWidth = 1.5; ctx.beginPath();
                for (const f of [0.22, 0.52, 0.8]) { ctx.moveTo(pl.x + dx + pl.w * f, pl.y); ctx.lineTo(pl.x + dx + pl.w * f - 5, pl.y + pl.h); }
                ctx.stroke();
            }
        }
        if (pl.flash > 0) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(pl.x, pl.y, pl.w, pl.h); }
        ctx.globalAlpha = 1;
    }
    
    drawCourseObjects();

    // Draw Crown
    if (crown.active) {
        let floatY = Math.sin(Date.now() / 250) * 8;
        ctx.shadowColor = "#fbbf24";
        ctx.shadowBlur = 15;
        ctx.font = "32px Arial";
        ctx.textAlign = "center";
        ctx.fillText("👑", crown.x, crown.y + floatY);
        ctx.shadowBlur = 0;
    }

    for (const c of allChars()) c.draw();
    for (const a of projectiles) drawAxe(a);
    for (const b of blasts) {                                           // ledakan bom
        const k = b.t / BOMB_BOOM, r = BOMB_R * Math.pow(k, 0.6);
        ctx.fillStyle = `rgba(251,146,60,${0.55 * (1 - k)})`; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = `rgba(254,240,138,${1 - k})`; ctx.lineWidth = 3; ctx.stroke();
    }
    for (const f of effects) {
        ctx.strokeStyle = `rgba(255,255,255,${1 - f.t / 14})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(f.x, f.y, 4 + f.t * 2, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.restore();           // akhir guncangan layar
    drawHUD();
    drawSplash();
}

const DT = 1000 / 60;
let acc = 0, last = performance.now();
function frame(now) {
    acc += Math.min(now - last, 100); last = now;
    while (acc >= DT) { step(); acc -= DT; }
    draw();
    requestAnimationFrame(frame);
}

// ==========================================================
//  INPUT & INIT
// ==========================================================
const bindCodes = new Set();
for (const c of chars) Object.values(c.binds).forEach(k => bindCodes.add(k));

function setKey(code, down) {
    for (const c of chars)
        for (const action of ['left', 'right', 'jump', 'punch'])
            if (c.binds[action] === code) c.input[action] = down;
}
window.addEventListener('keydown', e => {
    if (bindCodes.has(e.code)) { setKey(e.code, true); e.preventDefault(); }
    if (e.code === 'Enter' && (phase === 'roundEnd' || phase === 'matchEnd')) phaseT = 1;   // lewati splash
});
window.addEventListener('keyup', e => {
    if (bindCodes.has(e.code)) { setKey(e.code, false); e.preventDefault(); }
});
window.addEventListener('blur', () => { for (const c of chars) c.input = { left: false, right: false, jump: false, punch: false }; });

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    groundY = height - FLOOR_HEIGHT;
}
window.addEventListener('resize', () => {
    resize();
    if (phase === 'intro' || phase === 'fight') startRound();     // ulang ronde yang sama, skor tetap
});

// ==BOOT==
resize();
newMatch();
requestAnimationFrame(frame);
</script>
